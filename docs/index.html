<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>창원 산업단지 AX 동향 모니터</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --text: #1f2328;
    --muted: #656d76;
    --line: #d8dee4;
    --accent: #0969da;
    --warn-bg: #fff8c5;
    --warn-line: #d4a72c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .lead { color: var(--muted); margin: 0 0 24px; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  textarea {
    width: 100%;
    min-height: 160px;
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font: 0.9rem/1.4 ui-monospace, Consolas, monospace;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  button {
    padding: 6px 14px;
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    cursor: pointer;
  }
  .hint { color: var(--muted); font-size: 0.9rem; }
  .summary { margin: 0; font-weight: 600; }
  .error { color: #cf222e; font-weight: 600; }
  .skipped {
    margin-top: 12px;
    padding: 8px 12px;
    background: var(--warn-bg);
    border: 1px solid var(--warn-line);
    border-radius: 6px;
  }
  .skipped ul { margin: 4px 0 0; padding-left: 20px; }
  .placeholder { color: var(--muted); }

  /* ③ 결과: 그래프·목록 */
  .viz-root {
    --surface-1: #ffffff;
    --text-primary: #1f2328;
    --text-secondary: #52514e;
    --grid: #e6e6e3;
    --series-1: #2a78d6;
  }
  .check { margin: 0 0 16px; padding: 8px 12px; border-radius: 6px; background: #f0f6ff; font-weight: 600; }
  .check.bad { background: #ffebe9; color: #cf222e; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .chart h3, #output h3 { font-size: 1rem; margin: 0 0 8px; }
  .bar-row { display: grid; grid-template-columns: 8.5em 1fr 2.5em; gap: 8px; align-items: center; margin: 6px 0; font-size: 0.9rem; }
  .bar-track { height: 16px; }
  .bar { height: 100%; background: var(--series-1); border-radius: 0 4px 4px 0; }
  .bar-row:hover .bar { filter: brightness(1.15); }
  .bar-value { color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .line-wrap { position: relative; }
  .line-wrap svg { width: 100%; height: auto; display: block; }
  .line-wrap text { fill: var(--text-secondary); font-size: 11px; }
  .tooltip {
    position: absolute; pointer-events: none; padding: 4px 8px; border-radius: 4px;
    background: var(--text-primary); color: #fff; font-size: 0.85rem; white-space: nowrap;
  }
  .tooltip[hidden] { display: none; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .filters button { background: #fff; color: var(--accent); }
  .filters button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .filters input { padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  td.date { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .list-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin: 16px 0 8px; }
  .list-head h3 { margin: 0; }
  details { margin-top: 8px; font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>창원 산업단지 AX 동향 모니터</h1>
  <p class="lead">기사 목록(date,title,url)을 넣으면 분야·쟁점으로 나눠 개수·추이·목록을 보여 줍니다.</p>

  <!-- ① 입력 -->
  <section id="input">
    <h2>기사 목록 넣기</h2>
    <textarea id="csvText" placeholder="date,title,url&#10;2026-01-06,기사 제목,https://..."></textarea>
    <div class="controls">
      <button type="button" id="readText">붙여 넣은 내용 읽기</button>
      <button type="button" id="loadSample">예시 불러오기</button>
      <label class="hint">또는 CSV 파일 고르기 <input type="file" id="csvFile" accept=".csv,text/csv"></label>
    </div>
    <div id="inputResult" class="hint">아직 읽은 기사가 없습니다.</div>
  </section>

  <!-- ② 분류 -->
  <section id="classify">
    <h2>분류</h2>
    <div id="classifyResult" class="hint">아직 분류한 기사가 없습니다.</div>
  </section>

  <!-- ③ 표·그래프·내보내기 -->
  <section id="output" class="viz-root">
    <h2>결과</h2>
    <p id="outputEmpty" class="hint">기사를 넣으면 그래프와 목록이 나옵니다.</p>
    <div id="outputBody" hidden>
      <p id="checkLine" class="check"></p>
      <p id="regionNote" class="skipped" hidden></p>

      <div class="charts">
        <div class="chart">
          <h3>분야별 개수</h3>
          <div id="fieldBars"></div>
        </div>
        <div class="chart">
          <h3>월별 추이 (전체 기사 수)</h3>
          <div class="line-wrap" id="lineWrap">
            <div class="tooltip" id="lineTip" hidden></div>
          </div>
          <details>
            <summary>표로 보기</summary>
            <table id="monthTable"></table>
          </details>
        </div>
      </div>

      <div class="list-head">
        <h3>쟁점별 목록 <span id="listCount" class="hint"></span></h3>
        <button type="button" id="exportCsv">CSV 내보내기</button>
      </div>
      <div class="filters" id="issueFilters"></div>
      <div class="filters">
        <label class="hint">제목 검색 <input type="search" id="titleSearch"></label>
      </div>
      <div class="table-wrap"><table id="articleTable"></table></div>

      <div class="list-head"><h3>미분류 목록 <span class="hint">분류 사전 보강 후보</span></h3></div>
      <div class="table-wrap"><table id="unclassifiedTable"></table></div>
    </div>
  </section>
</main>

<script src="dictionary.js"></script>
<script src="sample.js"></script>
<script>
// ===== ① 입력: CSV 읽기 =====

// CSV 글자를 줄 단위 칸 목록으로 나눈다. 따옴표로 묶인 칸(쉼표·줄바꿈 포함)도 읽는다.
// 각 줄에는 파일에서 시작한 줄 번호(1부터)를 붙인다.
function parseCsv(text) {
  text = text.replace(/^﻿/, ''); // 파일 맨 앞 BOM 제거
  const rows = [];
  let row = [], field = '', inQuotes = false;
  let line = 1, rowLine = 1;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else {
        if (ch === '\n') line++;
        field += ch;
      }
    } else if (ch === '"') {
      inQuotes = true;
    } else if (ch === ',') {
      row.push(field); field = '';
    } else if (ch === '\r') {
      // \r\n 의 \r 은 무시
    } else if (ch === '\n') {
      row.push(field);
      rows.push({ line: rowLine, cells: row });
      row = []; field = '';
      line++; rowLine = line;
    } else {
      field += ch;
    }
  }
  if (field !== '' || row.length > 0) {
    row.push(field);
    rows.push({ line: rowLine, cells: row });
  }
  return rows;
}

// 칸 목록을 기사 목록으로 바꾼다. 빈 줄, 날짜·제목이 빠진 줄은 건너뛰고 줄 번호를 남긴다.
function readArticles(text) {
  const rows = parseCsv(text);
  const isBlank = r => r.cells.every(c => c.trim() === '');

  const headerIndex = rows.findIndex(r => !isBlank(r));
  if (headerIndex === -1) return { error: '내용이 없습니다.' };

  const header = rows[headerIndex].cells.map(c => c.trim().toLowerCase());
  const col = { date: header.indexOf('date'), title: header.indexOf('title'), url: header.indexOf('url') };
  if (col.date === -1 || col.title === -1) {
    return { error: '첫 줄에 date,title,url 열 이름이 있어야 합니다.' };
  }

  const articles = [];
  const skipped = [];
  for (const r of rows.slice(headerIndex + 1)) {
    if (isBlank(r)) { skipped.push({ line: r.line, reason: '빈 줄' }); continue; }
    const date = (r.cells[col.date] || '').trim();
    const title = (r.cells[col.title] || '').trim();
    const url = col.url === -1 ? '' : (r.cells[col.url] || '').trim();
    if (!date) { skipped.push({ line: r.line, reason: '날짜 없음' }); continue; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { skipped.push({ line: r.line, reason: '날짜 형식이 YYYY-MM-DD가 아님' }); continue; }
    if (!title) { skipped.push({ line: r.line, reason: '제목 없음' }); continue; }
    articles.push({ date, title, url });
  }
  return { articles, skipped };
}

// 읽은 결과를 화면에 보여 준다.
function showInputResult(result) {
  const box = document.getElementById('inputResult');
  box.className = '';
  box.textContent = '';

  if (result.error) {
    box.className = 'error';
    box.textContent = result.error;
    return;
  }

  const summary = document.createElement('p');
  summary.className = 'summary';
  summary.textContent = `읽은 기사 ${result.articles.length}건 · 건너뛴 줄 ${result.skipped.length}개`;
  box.appendChild(summary);

  if (result.skipped.length > 0) {
    const warn = document.createElement('div');
    warn.className = 'skipped';
    warn.textContent = '건너뛴 줄:';
    const list = document.createElement('ul');
    for (const s of result.skipped) {
      const li = document.createElement('li');
      li.textContent = `${s.line}번째 줄 — ${s.reason}`;
      list.appendChild(li);
    }
    warn.appendChild(list);
    box.appendChild(warn);
  }
}

// ===== ② 분류: 분류 사전(dictionary.js) 적용 =====

// 키워드가 제목에 있는지 본다. 영문으로 시작·끝나는 키워드는 그 쪽 옆에 다른 영문 글자가 없을 때만 걸린다.
function hasKeyword(title, keyword) {
  const escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const before = /^[A-Za-z]/.test(keyword) ? '(?<![A-Za-z])' : '';
  const after = /[A-Za-z]$/.test(keyword) ? '(?![A-Za-z])' : '';
  return new RegExp(before + escaped + after, 'i').test(title);
}

const matches = (title, group) => group.keywords.some(k => hasKeyword(title, k));

// 기사 한 건을 기획안의 "넘길결과" 모양으로 만든다.
function classifyArticle(article, dict) {
  return {
    date: article.date,
    title: article.title,
    url: article.url,
    fields: dict.fields.filter(f => matches(article.title, f)).map(f => f.name),
    issues: dict.issues.filter(i => matches(article.title, i)).map(i => i.name),
    changwon: article.title.includes(dict.region),
  };
}

// 분류 결과를 간단한 숫자로 보여 준다. 그래프와 목록은 이슈 #3에서 만든다.
function showClassifyResult(items, dict) {
  const box = document.getElementById('classifyResult');
  box.className = '';
  box.textContent = '';
  if (items.length === 0) {
    box.className = 'hint';
    box.textContent = '아직 분류한 기사가 없습니다.';
    return;
  }

  const unclassified = items.filter(a => a.fields.length === 0).length;
  const noRegion = items.filter(a => !a.changwon).length;

  const summary = document.createElement('p');
  summary.className = 'summary';
  summary.textContent = `총 ${items.length}건 = 분류됨 ${items.length - unclassified} + 미분류 ${unclassified}`;
  box.appendChild(summary);

  const addList = (heading, rows) => {
    const p = document.createElement('p');
    p.textContent = heading;
    const ul = document.createElement('ul');
    for (const [name, count] of rows) {
      const li = document.createElement('li');
      li.textContent = `${name}: ${count}건`;
      ul.appendChild(li);
    }
    box.append(p, ul);
  };
  addList('분야별 (걸리는 것 모두)', dict.fields.map(f => [f.name, items.filter(a => a.fields.includes(f.name)).length]));
  addList('쟁점별 (걸리는 것 모두)', dict.issues.map(i => [i.name, items.filter(a => a.issues.includes(i.name)).length]));

  const region = document.createElement('p');
  region.textContent = `제목에 "${dict.region}"이 없는 기사: ${noRegion}건`;
  box.appendChild(region);
}

// ===== ③ 표·그래프·내보내기 =====

const SVG_NS = 'http://www.w3.org/2000/svg';

function el(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function svgEl(tag, attrs) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
}

// 제목 칸: http(s) 링크만 걸고, 나머지는 글자로 둔다.
function titleCell(article) {
  const td = el('td');
  if (/^https?:\/\//i.test(article.url)) {
    const a = el('a', article.title);
    a.href = article.url;
    a.target = '_blank';
    a.rel = 'noopener';
    td.appendChild(a);
  } else {
    td.textContent = article.title;
  }
  return td;
}

function fillTable(table, headers, rows) {
  table.textContent = '';
  const head = el('tr');
  for (const h of headers) head.appendChild(el('th', h));
  table.appendChild(head);
  for (const cells of rows) {
    const tr = el('tr');
    for (const c of cells) tr.appendChild(c instanceof Node ? c : el('td', c));
    table.appendChild(tr);
  }
}

// 점검 줄: 총 건수 = 분류됨 + 미분류, 여러 분야에 걸친 기사, 건너뛴 줄.
// 분야는 걸리는 것을 모두 세므로, 분야 막대의 합 = 기사마다 걸린 분야 수의 합이어야 한다. 다르면 빨갛게 표시한다.
function renderCheck(items, skippedCount) {
  const unclassified = items.filter(a => a.fields.length === 0).length;
  const multi = items.filter(a => a.fields.length > 1).length;
  const barTotal = DICTIONARY.fields.reduce((n, f) => n + items.filter(a => a.fields.includes(f.name)).length, 0);
  const ok = barTotal === items.reduce((n, a) => n + a.fields.length, 0);
  const line = document.getElementById('checkLine');
  line.textContent = `점검: 총 ${items.length}건 = 분류됨 ${items.length - unclassified} + 미분류 ${unclassified}` +
    ` · 여러 분야에 걸친 기사 ${multi}건 · 분야 막대 합 ${barTotal}` +
    ` · 건너뛴 줄 ${skippedCount}개 · ${ok ? '합계 맞음' : '합계가 맞지 않음'}`;
  line.className = ok ? 'check' : 'check bad';

  const noRegion = items.filter(a => !a.changwon);
  const note = document.getElementById('regionNote');
  note.hidden = noRegion.length === 0;
  note.textContent = '';
  if (noRegion.length > 0) {
    note.appendChild(el('span', `제목에 "${DICTIONARY.region}"이 없는 기사 ${noRegion.length}건 — 창원 기사인지 확인하세요:`));
    const ul = el('ul');
    for (const a of noRegion) ul.appendChild(el('li', `${a.date} ${a.title}`));
    note.appendChild(ul);
  }
}

// 분야별 막대: 분야 하나에 막대 하나, 값은 막대 옆에 바로 적는다.
function renderFieldBars(items) {
  const box = document.getElementById('fieldBars');
  box.textContent = '';
  const rows = DICTIONARY.fields.map(f => [f.name, items.filter(a => a.fields.includes(f.name)).length]);
  rows.push(['미분류', items.filter(a => a.fields.length === 0).length]);
  const max = Math.max(1, ...rows.map(r => r[1]));
  for (const [name, count] of rows) {
    const row = el('div', undefined, 'bar-row');
    row.title = `${name}: ${count}건`;
    const track = el('div', undefined, 'bar-track');
    const bar = el('div', undefined, 'bar');
    bar.style.width = count > 0 ? `max(2px, ${(count / max) * 100}%)` : '0';
    if (name === '미분류') bar.style.background = 'var(--muted)';
    track.appendChild(bar);
    row.append(el('span', name), track, el('span', `${count}`, 'bar-value'));
    box.appendChild(row);
  }
}

// 첫 달부터 마지막 달까지 빈 달 없이 월별 기사 수를 센다.
function countByMonth(items) {
  const months = items.map(a => a.date.slice(0, 7)).sort();
  if (months.length === 0) return [];
  const result = [];
  let [y, m] = months[0].split('-').map(Number);
  const last = months[months.length - 1];
  while (true) {
    const key = `${y}-${String(m).padStart(2, '0')}`;
    result.push({ month: key, count: months.filter(x => x === key).length });
    if (key === last) break;
    m++;
    if (m > 12) { m = 1; y++; }
  }
  return result;
}

// 월별 선 그래프 (선 1개). 포인터를 올리면 가장 가까운 달의 건수를 보여 준다.
function renderMonthLine(items) {
  const wrap = document.getElementById('lineWrap');
  const tip = document.getElementById('lineTip');
  wrap.querySelectorAll('svg').forEach(s => s.remove());
  tip.hidden = true;

  const data = countByMonth(items);
  const oneYear = data.length > 0 && data[0].month.slice(0, 4) === data[data.length - 1].month.slice(0, 4);
  const label = d => oneYear ? `${Number(d.month.slice(5))}월` : d.month;

  const W = 480, H = 200, left = 28, right = 12, top = 12, bottom = 28;
  const maxY = Math.max(1, ...data.map(d => d.count));
  const x = i => data.length === 1 ? (left + W - right) / 2 : left + (i * (W - left - right)) / (data.length - 1);
  const y = v => top + (H - top - bottom) * (1 - v / maxY);

  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': '월별 기사 수 선 그래프' });
  for (let v = 0; v <= maxY; v++) {
    svg.appendChild(svgEl('line', { x1: left, x2: W - right, y1: y(v), y2: y(v), stroke: 'var(--grid)', 'stroke-width': 1 }));
    const t = svgEl('text', { x: left - 6, y: y(v) + 4, 'text-anchor': 'end' });
    t.textContent = v;
    svg.appendChild(t);
  }
  data.forEach((d, i) => {
    const t = svgEl('text', { x: x(i), y: H - 8, 'text-anchor': 'middle' });
    t.textContent = label(d);
    svg.appendChild(t);
  });
  const hair = svgEl('line', { y1: top, y2: H - bottom, stroke: 'var(--text-secondary)', 'stroke-width': 1, visibility: 'hidden' });
  svg.appendChild(hair);
  svg.appendChild(svgEl('polyline', {
    points: data.map((d, i) => `${x(i)},${y(d.count)}`).join(' '),
    fill: 'none', stroke: 'var(--series-1)', 'stroke-width': 2, 'stroke-linejoin': 'round',
  }));
  data.forEach((d, i) => {
    svg.appendChild(svgEl('circle', { cx: x(i), cy: y(d.count), r: 4, fill: 'var(--series-1)', stroke: 'var(--surface-1)', 'stroke-width': 2 }));
  });
  wrap.insertBefore(svg, tip);

  svg.addEventListener('pointermove', e => {
    if (data.length === 0) return;
    const box = svg.getBoundingClientRect();
    const px = ((e.clientX - box.left) / box.width) * W;
    let i = 0;
    data.forEach((_, j) => { if (Math.abs(x(j) - px) < Math.abs(x(i) - px)) i = j; });
    hair.setAttribute('x1', x(i));
    hair.setAttribute('x2', x(i));
    hair.setAttribute('visibility', 'visible');
    tip.textContent = `${data[i].count}건 · ${data[i].month}`;
    tip.hidden = false;
    const scale = box.width / W;
    tip.style.left = `${Math.min(x(i) * scale + 8, box.width - tip.offsetWidth)}px`;
    const pointY = y(data[i].count) * scale;
    tip.style.top = `${pointY < 36 ? pointY + 12 : pointY - 32}px`; // 위쪽 점은 툴팁을 아래에
  });
  svg.addEventListener('pointerleave', () => { tip.hidden = true; hair.setAttribute('visibility', 'hidden'); });

  fillTable(document.getElementById('monthTable'), ['월', '기사 수'], data.map(d => [d.month, `${d.count}`]));
}

// 쟁점 버튼과 제목 검색으로 거른 목록. 내보내기도 이 목록을 쓴다.
let activeIssue = '';

function filteredArticles() {
  const q = document.getElementById('titleSearch').value.trim().toLowerCase();
  return classified.filter(a =>
    (activeIssue === '' || a.issues.includes(activeIssue)) &&
    (q === '' || a.title.toLowerCase().includes(q)));
}

function renderIssueFilters() {
  const box = document.getElementById('issueFilters');
  box.textContent = '';
  const options = [['', '전체']].concat(DICTIONARY.issues.map(i => [i.name, i.name]));
  for (const [value, text] of options) {
    const count = value === '' ? classified.length : classified.filter(a => a.issues.includes(value)).length;
    const b = el('button', `${text} ${count}`);
    b.type = 'button';
    b.setAttribute('aria-pressed', String(value === activeIssue));
    b.addEventListener('click', () => { activeIssue = value; renderIssueFilters(); renderArticleList(); });
    box.appendChild(b);
  }
}

function renderArticleList() {
  const list = filteredArticles();
  document.getElementById('listCount').textContent = `${list.length}건 표시`;
  fillTable(document.getElementById('articleTable'), ['날짜', '제목', '분야', '쟁점'],
    list.map(a => [el('td', a.date, 'date'), titleCell(a), a.fields.join(', ') || '미분류', a.issues.join(', ') || '—']));
}

function renderUnclassified() {
  const list = classified.filter(a => a.fields.length === 0);
  fillTable(document.getElementById('unclassifiedTable'), ['날짜', '제목', '쟁점'],
    list.map(a => [el('td', a.date, 'date'), titleCell(a), a.issues.join(', ') || '—']));
}

// CSV 칸 하나: 쉼표·따옴표·줄바꿈이 있으면 따옴표로 묶는다.
const csvCell = v => /[",\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;

// 지금 보이는 목록을 date,title,url,분야,쟁점 열로 만든다. 다시 넣으면 date,title,url만 읽는다.
function toCsv(list) {
  const lines = [['date', 'title', 'url', '분야', '쟁점']];
  for (const a of list) lines.push([a.date, a.title, a.url, a.fields.join('; ') || '미분류', a.issues.join('; ')]);
  return lines.map(cells => cells.map(csvCell).join(',')).join('\r\n') + '\r\n';
}

document.getElementById('exportCsv').addEventListener('click', () => {
  // 엑셀에서 한글이 깨지지 않도록 BOM을 붙인다.
  const blob = new Blob(['﻿' + toCsv(filteredArticles())], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '분류결과.csv';
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById('titleSearch').addEventListener('input', renderArticleList);

function renderOutput(items, skippedCount) {
  document.getElementById('outputEmpty').hidden = items.length > 0;
  document.getElementById('outputBody').hidden = items.length === 0;
  if (items.length === 0) return;
  if (activeIssue && !DICTIONARY.issues.some(i => i.name === activeIssue)) activeIssue = '';
  renderCheck(items, skippedCount);
  renderFieldBars(items);
  renderMonthLine(items);
  renderIssueFilters();
  renderArticleList();
  renderUnclassified();
}

// 읽은 기사 목록과 분류한 결과
let articles = [];
let classified = [];

function handleText(text) {
  const result = readArticles(text);
  articles = result.articles || [];
  showInputResult(result);
  classified = articles.map(a => classifyArticle(a, DICTIONARY));
  showClassifyResult(classified, DICTIONARY);
  renderOutput(classified, (result.skipped || []).length);
}

document.getElementById('readText').addEventListener('click', () => {
  handleText(document.getElementById('csvText').value);
});

document.getElementById('loadSample').addEventListener('click', () => {
  document.getElementById('csvText').value = SAMPLE_CSV;
  handleText(SAMPLE_CSV);
});

document.getElementById('csvFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    document.getElementById('csvText').value = reader.result;
    handleText(reader.result);
  };
  reader.readAsText(file, 'utf-8');
});
</script>
</body>
